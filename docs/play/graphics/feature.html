<!doctype html>
<!-- Play Store feature graphic, 1024 x 500. Render with render.sh.
     The widget mock uses the real widget's colours and icon shapes. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
    color: #fff;
    background:
      radial-gradient(circle at 78% 30%, rgb(255 255 255 / 0.16), transparent 45%),
      linear-gradient(135deg, #FF8F2E 0%, #FF6D00 55%, #E65A00 100%);
  }

  .brand {
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    width: 430px;
  }
  .brand img { display: block; width: 168px; height: 168px; margin: -34px 0 -14px -34px; }
  .brand h1 { margin: 0; font-size: 54px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  .brand p { margin: 14px 0 0; font-size: 25px; line-height: 1.3; opacity: 0.92; }

  .widget {
    position: absolute;
    right: 64px;
    top: 50%;
    width: 420px;
    transform: translateY(-50%) rotate(-3deg);
    background: rgb(26 26 46 / 0.94);
    border-radius: 24px;
    padding: 18px 16px 16px;
    box-shadow: 0 24px 60px rgb(80 30 0 / 0.45);
  }
  .widget h2 { margin: 0 4px 12px; font-size: 18px; font-weight: 700; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    margin-top: 8px;
    border-radius: 12px;
    background: rgb(255 255 255 / 0.10);
  }
  .row .text { flex: 1; min-width: 0; }
  .row strong { display: block; font-size: 17px; }
  .row span { display: block; font-size: 14px; color: rgb(255 255 255 / 0.67); white-space: nowrap; }
  .btn {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 50%;
    background: rgb(255 255 255 / 0.165);
    display: grid; place-items: center;
  }
  .btn svg { width: 26px; height: 26px; }
</style>
</head>
<body>
  <div class="brand">
    <img src="pig.png" alt="">
    <h1>Firefly Shortcuts</h1>
    <p>Your routine transactions,<br>one tap away.</p>
  </div>

  <div class="widget">
    <h2>Shortcuts</h2>
    <div class="row">
      <div class="text"><strong>☕ Coffee</strong><span>Cash wallet → Coffee shop · 3.50 €</span></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path fill="#4CAF50" d="M9,16.17L4.83,12l-1.42,1.41L9,19 21,7l-1.41,-1.41z"/></svg></div>
    </div>
    <div class="row">
      <div class="text"><strong>🍔 Lunch</strong><span>Checking → Cafeteria · 12.00 €</span></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path fill="#FFA726" d="M6,2v6l4,4 -4,4v6h12v-6l-4,-4 4,-4V2H6zM16,16.5V20H8v-3.5l4,-4 4,4zM12,12l-4,-4V4h8v4l-4,4z"/></svg></div>
    </div>
    <div class="row">
      <div class="text"><strong>🐷 Savings</strong><span>Checking → Savings · 100.00 €</span></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path fill="#4CAF50" d="M8,5v14l11,-7z"/></svg></div>
    </div>
    <div class="row">
      <div class="text"><strong>🚌 Bus pass</strong><span>Checking → City transit · 25.00 €</span></div>
      <div class="btn"><svg viewBox="0 0 24 24"><path fill="#4CAF50" d="M8,5v14l11,-7z"/></svg></div>
    </div>
  </div>
</body>
</html>
