<!doctype html>
<!-- Play Store icon, 512 x 512. Render with render.sh. Full bleed: Play rounds the corners itself. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
  body { background: #FF6D00; }
  /* Same proportions as the launcher icon: the foreground fills the tile. */
  img { display: block; width: 512px; height: 512px; }
</style>
</head>
<body>
  <img src="pig.png" alt="">
</body>
</html>
